name: Secret Scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched Git history without exposing secrets
        run: >-
          docker run --rm --read-only --cap-drop ALL
          --security-opt no-new-privileges:true
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          -v "${{ github.workspace }}:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact=100 --no-banner --ignore-gitleaks-allow --log-opts=--all .
      - name: Scan the clean checkout content
        run: >-
          docker run --rm --read-only --cap-drop ALL
          --security-opt no-new-privileges:true
          -v "${{ github.workspace }}:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir --redact=100 --no-banner --ignore-gitleaks-allow .
