services:
  app:
    image: ${GAME_IMAGE:-avalon:local}
    build: ..
    restart: unless-stopped
    init: true
    env_file: ${GAME_ENV_FILE:-.env.public}
    environment:
      APP_MODE: public
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY_CIDRS: ${GAME_NETWORK_GATEWAY:-172.30.70.1}/32,${GAME_CADDY_IP:-172.30.70.2}/32
    ports:
      - "127.0.0.1:${GAME_HTTP_PORT:-3100}:3000"
    expose:
      - "3000"
    volumes:
      - app_data:/app/data
    networks:
      backend:
        ipv4_address: ${GAME_APP_IP:-172.30.70.3}
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    profiles: [standalone]
    restart: unless-stopped
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:-}
      TLS_EMAIL: ${TLS_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-policy.caddy:/etc/caddy/caddy-policy.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: ${GAME_CADDY_IP:-172.30.70.2}
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  backend:
    ipam:
      config:
        - subnet: ${GAME_NETWORK_SUBNET:-172.30.70.0/24}
          gateway: ${GAME_NETWORK_GATEWAY:-172.30.70.1}
volumes:
  app_data:
  caddy_data:
  caddy_config:
